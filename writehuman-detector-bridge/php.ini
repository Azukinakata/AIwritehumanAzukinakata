; php.ini for the writehuman-detector bridge (AIwritehuman-specific).
; Points PHP at the Scoop-installed PHP 7.4 extension dir and enables the
; extensions the vendored Turnitin PHP SDK requires.
; NOTE: the SDK targets PHP 7.x; PHP 8.x SoapClient signature changes break it,
; so this bridge must run under PHP 7.4 (scoop: php74).
extension_dir = "C:/Users/tmodumo/scoop/apps/php74/current/ext"
extension=openssl
extension=curl
extension=soap
extension=mbstring

; Sensible runtime limits for similarity-check requests
max_execution_time = 120
memory_limit = 256M
display_errors = Off
